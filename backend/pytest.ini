[pytest]
asyncio_mode = auto
; A single event loop for the whole session, matching the session-scoped
; async engine in tests/conftest.py — mixing per-test loops with a
; longer-lived asyncpg connection pool breaks connection cleanup (especially
; on Windows' ProactorEventLoop).
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
