# Saved Meals CRUD + M4's Progress history: create a saved meal template,
# log it, then confirm it shows up in the Progress tab's Meal History.
# Needs a real Anthropic key configured on the backend (ingredient
# resolution goes through the same LLM-backed /api/resolve-ingredient used
# elsewhere in the app).
---
- runFlow: login.yaml

- tapOn: "New"
- tapOn: "e.g. Omelette + Protein Shake"
- inputText: "Maestro Omelette"
- tapOn: "Name (e.g. egg)"
- inputText: "egg"
- tapOn: "Add"
- assertVisible: "egg"
- tapOn: "Log now"

- assertVisible: 'Logged "Maestro Omelette"'

- tapOn: "Progress"
- assertVisible: "Logged saved meal: Maestro Omelette"
