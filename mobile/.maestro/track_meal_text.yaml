# Core M2 loop: log a meal by typing it, see it reflected on the dashboard.
# Needs a real Anthropic (and optionally Tavily) key configured on the
# backend you're running against, since /api/track-meal resolves macros
# through the same LLM pipeline as production.
---
- runFlow: login.yaml

- tapOn: "Log a meal… e.g. 2 eggs and toast"
- inputText: "2 eggs and toast"
- tapOn: "Log meal"

- assertVisible: "Meal logged!"
- assertVisible: "2 eggs and toast"
